<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Day 8 - Color Calibration Tool</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 30px;
  }
  .camera-container {
    width: 400px;
    height: 300px;
    border: 3px solid #333;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }
  .camera-container video { width: 100%; height: 100%; object-fit: cover; }
  canvas { display: none; }
  button {
    margin-top: 16px;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #2980b9;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #1f618d; }
  table {
    margin-top: 24px;
    border-collapse: collapse;
    width: 480px;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px 12px;
    text-align: center;
  }
  th { background: #f0f0f0; }
  .swatch {
    width: 24px;
    height: 24px;
    border-radius: 4px;
    display: inline-block;
    border: 1px solid #333;
  }
  input[type="text"] {
    padding: 6px;
    margin-top: 12px;
    width: 200px;
  }
</style>
</head>
<body>
  <h2>Color Calibration Tool</h2>
  <p>Point camera at a medicine, label it, then capture.</p>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <input type="text" id="labelInput" placeholder="e.g. Red Tablet" />
  <button id="captureBtn">Capture Reading</button>

  <canvas id="canvas" width="400" height="300"></canvas>

  <table id="logTable">
    <thead>
      <tr><th>Label</th><th>R</th><th>G</th><th>B</th><th>Swatch</th></tr>
    </thead>
    <tbody id="logBody"></tbody>
  </table>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const captureBtn = document.getElementById('captureBtn');
    const labelInput = document.getElementById('labelInput');
    const logBody = document.getElementById('logBody');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      } catch (err) {
        alert('Camera error: ' + err.message);
      }
    }

    function getAverageColor(canvas) {
      const ctx = canvas.getContext('2d');
      const { width, height } = canvas;
      const imageData = ctx.getImageData(0, 0, width, height);
      const data = imageData.data;

      let rTotal = 0, gTotal = 0, bTotal = 0;
      const pixelCount = data.length / 4;

      for (let i = 0; i < data.length; i += 4) {
        rTotal += data[i];
        gTotal += data[i + 1];
        bTotal += data[i + 2];
      }

      return {
        r: Math.round(rTotal / pixelCount),
        g: Math.round(gTotal / pixelCount),
        b: Math.round(bTotal / pixelCount),
      };
    }

    captureBtn.addEventListener('click', () => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const avgColor = getAverageColor(canvas);
      const label = labelInput.value.trim() || 'Unlabeled';

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${label}</td>
        <td>${avgColor.r}</td>
        <td>${avgColor.g}</td>
        <td>${avgColor.b}</td>
        <td><span class="swatch" style="background: rgb(${avgColor.r},${avgColor.g},${avgColor.b})"></span></td>
      `;
      logBody.appendChild(row);

      labelInput.value = '';
      labelInput.focus();
    });

    startCamera();
  </script>
</body>
</html>
